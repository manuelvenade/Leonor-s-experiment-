{{ block scripts }}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="{{ static 'js/format_numbers.js' }}"></script>
    <script src="{{ static 'js/mobile.js' }}"></script>
    <script>
        window.NAV_CONDITION = "{{ nav_condition }}";
    </script>
    <script src="{{ static 'js/friction.js' }}"></script>
    <script src="{{ static 'js/video_feed.js' }}"></script>
{{ endblock }}

{{ block styles }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ static 'css/styles.css' }}">
    <link rel="stylesheet" href="{{ static 'css/user_icon.css' }}">
    <link rel="stylesheet" href="{{ static 'css/tiktok.css' }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ static 'img/favicon.ico' }}">
{{ endblock }}

{{ block content }}

<!-- Hidden Fields -->
<input type="hidden" name="viewport_data" id="viewport_data" value="">
<input type="hidden" name="promoted_post_clicks" id="promoted_post_clicks" value="">
<input type="hidden" id="likes_data" name="likes_data">
<input type="hidden" id="replies_data" name="replies_data">
<input type="hidden" id="friction_data" name="friction_data" value="">
<input type="hidden" id="completed_feed" name="completed_feed" value="">
<input type="hidden" id="last_position_viewed" name="last_position_viewed" value="">
<input type="hidden" id="session_duration_seconds" name="session_duration_seconds" value="">
<input type="hidden" id="touch_capability" name="touch_capability" value="">
<input type="hidden" id="device_type" name="device_type" value="">
<input type="hidden" id="screen_resolution" name="screen_resolution" value="">

<!-- Loading Screen -->
<div id="loadingScreen" class="d-flex justify-content-center align-items-center" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#000;">
    <div class="tap-to-start">
        <i class="bi bi-play-circle-fill logo-icon"></i>
        <p>Tap to start</p>
        <button id="startBtn" type="button">Start</button>
    </div>
</div>

<!-- Friction gate overlay -->
<div id="friction-gate" class="d-none">
    <div class="friction-gate-content">
        <button id="frictionContinueBtn" type="button">Continue</button>
    </div>
</div>

<!-- Main Content -->
<div id="mainContent" style="display:none;">

    <!-- Mute button (fixed top-right) -->
    <button id="mute-btn" type="button" aria-label="Toggle mute">
        <i class="bi bi-volume-up-fill"></i>
    </button>

    <!-- Video Feed (snap scroll) -->
    <div id="video-feed">

        {{ for i in posts.values() }}
            {{ include C.ITEM_POST }}
        {{ endfor }}

        <!-- End card -->
        <div class="video-item end-card" id="end-card">
            <div class="end-card-content">
                <i class="bi bi-check-circle-fill" style="font-size:48px;color:#fe2c55;"></i>
                <p>You've seen all videos</p>
                <button class="proceed-btn" id="submitButton" type="submit">Proceed to survey</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
        <button type="button" class="nav-btn active">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </button>
        <button type="button" class="nav-btn">
            <i class="bi bi-search"></i>
            <span>Discover</span>
        </button>
        <button type="button" class="nav-btn">
            <i class="bi bi-plus-square"></i>
            <span>Create</span>
        </button>
        <button type="submit" class="nav-btn nav-btn-proceed">
            <i class="bi bi-box-arrow-up-right"></i>
            <span>Survey</span>
        </button>
        <button type="button" class="nav-btn" id="profileNavBtn"
                data-bs-toggle="popover"
                data-bs-placement="top"
                data-bs-content="Your participant ID: {{ participant.code }}">
            <i class="bi bi-person-circle"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- Comment Drawer -->
    <div id="comment-drawer">
        <div id="comment-drawer-header">
            <span>Comments</span>
            <button id="close-comments" type="button" aria-label="Close comments">&times;</button>
        </div>
        <div id="comment-list">
            <p class="comment-empty-state">Be the first to comment.</p>
        </div>
        <div id="comment-input-area">
            <label for="comment-input" class="visually-hidden">Add a comment</label>
            <textarea id="comment-input" placeholder="Add a comment..." rows="1"></textarea>
            <button id="post-comment" type="button">Post</button>
        </div>
    </div>

    <!-- Comment Overlay -->
    <div id="comment-overlay"></div>

</div>

{{ endblock }}
